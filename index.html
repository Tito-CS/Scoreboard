<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard</title>
</head>

<body>
    <div class="container">
        <div>
            <h3>HOME</h3>
            <p id="home-score" class="score-box">0</p>
            <div class="points-btn">
                <button onclick="addOneHome()">+1</button>
                <button onclick="addTwoHome()">+2</button>
                <button onclick="addThreeHome()">+3</button>
            </div>
            <button class="reset-btn" onclick="resetHome()">Reset</button>
        </div>
        <div>
            <h3>GUEST</h3>
            <p id="guest-score" class="score-box">0</p>
            <div class="points-btn">
                <button onclick="addOneGuest()">+1</button>
                <button onclick="addTwoGuest()">+2</button>
                <button onclick="addThreeGuest()">+3</button>
            </div>
            <button class="reset-btn" onclick="resetGuest()">Reset</button>
        </div>
    </div>
    <script src="./index.js"></script>
</body>

</html>
